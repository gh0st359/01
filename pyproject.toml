[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organism-01"
version = "1.0.0"
description = "Persistent artificial cognitive organism 01 — non-LLM developmental research platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "01 Research" }]
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "websockets>=12.0",
  "orjson>=3.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
o1-runtime = "apps.organism_runtime.main:main"
o1-eval = "scripts.run_eval:main"
o1-reproduce = "scripts.reproduce:main"
o1-develop = "scripts.run_development:main"

[tool.setuptools.packages.find]
include = [
  "shared*",
  "learning*",
  "cognition*",
  "perception*",
  "world_model*",
  "memory*",
  "self_model*",
  "motivation*",
  "planning*",
  "imagination*",
  "language*",
  "simulation*",
  "embodiment*",
  "organism*",
  "instrumentation*",
  "storage*",
  "distributed*",
  "training*",
  "experiments*",
  "evaluation*",
  "apps*",
  "scripts*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "slow: long-running developmental or longitudinal tests",
  "gpu: requires GPU",
  "integration: multi-subsystem organism tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
